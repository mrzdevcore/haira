name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: compiler/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install UI dependencies
        run: cd ui/sdk && bun install --frozen-lockfile || bun install

      - name: Vet
        run: cd compiler && go vet ./...

      - name: Test
        run: cd compiler && go test ./...

      - name: Build compiler
        run: make build

      - name: Build examples
        run: make build-examples
