name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'spec/latex/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-latex-recommended latexmk lmodern

      - name: Build Language Specification PDF
        run: |
          cd spec/latex
          latexmk -pdf -interaction=nonstopmode haira-spec.tex
          mkdir -p ../../website/public
          cp haira-spec.pdf ../../website/public/haira-spec.pdf

      - name: Install dependencies
        run: cd website && bun install --frozen-lockfile || bun install

      - name: Build docs
        run: cd website && bun run build
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
