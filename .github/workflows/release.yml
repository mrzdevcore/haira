name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: compiler/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Install UI dependencies
        run: cd ui/sdk && bun install --frozen-lockfile || bun install

      - name: Bundle runtime
        run: make bundle-runtime

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle
          path: compiler/internal/runtime/bundle.tar.gz

  release:
    needs: bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: compiler/go.sum

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: runtime-bundle
          path: compiler/internal/runtime

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          BINARY="haira"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="haira.exe"
          fi
          cd compiler && go build -ldflags "-s -w -X main.version=${VERSION}" -o "${BINARY}" .

      - name: Ad-hoc sign (macOS)
        if: matrix.goos == 'darwin'
        run: codesign --sign - --force compiler/haira

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          NAME="haira-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${NAME}/bin"

          BINARY="haira"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="haira.exe"
          fi

          cp "compiler/${BINARY}" "${NAME}/bin/"
          cp LICENSE "${NAME}/"
          cp README.md "${NAME}/"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${NAME}.zip" "${NAME}"
            echo "ARCHIVE=${NAME}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            echo "ARCHIVE=${NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"
          else
            shasum -a 256 "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"
          fi

      - name: GPG sign archive
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HAIRA_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor --output "${{ env.ARCHIVE }}.asc" "${{ env.ARCHIVE }}"

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp "${{ env.ARCHIVE }}" release-files/
          cp "${{ env.ARCHIVE }}.sha256" release-files/
          if [ -f "${{ env.ARCHIVE }}.asc" ]; then
            cp "${{ env.ARCHIVE }}.asc" release-files/
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: release-files/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Remove bundle artifact
        run: rm -f dist/bundle.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
