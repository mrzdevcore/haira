<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <rect width="800" height="200" rx="12" fill="#0d1117"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#grid)" opacity="0.5"/>

  <g transform="translate(332, 4) scale(2)">
    <rect x="6" y="55" width="52" height="7" rx="3.5" fill="#3D2B1F"/>
    <rect x="12" y="47" width="9" height="10" rx="3" fill="#3D2B1F"/>
    <rect x="43" y="47" width="9" height="10" rx="3" fill="#3D2B1F"/>
    <rect x="12" y="47" width="40" height="4" rx="2" fill="#5C3A1E"/>
    <rect x="20" y="31" width="24" height="16" rx="4" fill="#E8A317"/>
    <rect x="25" y="34" width="14" height="10" rx="3" fill="#3D2B1F"/>
    <circle cx="32" cy="39" r="5" fill="#FDE68A" opacity="0.3"/>
    <circle cx="32" cy="39" r="3.5" fill="#FDE68A"/>
    <circle cx="32" cy="39" r="1.8" fill="#ffffff" opacity="0.9"/>
    <rect x="10" y="34" width="10" height="5" rx="2.5" fill="#E8A317"/>
    <rect x="44" y="34" width="10" height="5" rx="2.5" fill="#E8A317"/>
    <circle cx="9" cy="36.5" r="3.5" fill="#E8A317"/>
    <circle cx="9" cy="36.5" r="2" fill="#FDE68A"/>
    <circle cx="55" cy="36.5" r="3.5" fill="#E8A317"/>
    <circle cx="55" cy="36.5" r="2" fill="#FDE68A"/>
    <rect x="17" y="11" width="30" height="20" rx="6" fill="#F0BD4F"/>
    <rect x="21" y="15" width="22" height="9" rx="4" fill="#3D2B1F"/>
    <circle cx="27" cy="19.5" r="3.5" fill="#FDE68A"/>
    <circle cx="27" cy="19.5" r="1.5" fill="#ffffff"/>
    <circle cx="37" cy="19.5" r="3.5" fill="#FDE68A"/>
    <circle cx="37" cy="19.5" r="1.5" fill="#ffffff"/>
    <ellipse cx="32" cy="12" rx="31" ry="4.5" fill="#C4A265"/>
    <ellipse cx="32" cy="11.5" rx="29" ry="3.5" fill="#D4B87A"/>
    <line x1="4" y1="12" x2="60" y2="12" stroke="#B89555" stroke-width="0.4" opacity="0.5"/>
    <line x1="6" y1="13.5" x2="58" y2="13.5" stroke="#B89555" stroke-width="0.3" opacity="0.4"/>
    <rect x="15" y="2" width="34" height="10" rx="5" fill="#C4A265"/>
    <rect x="18" y="0" width="28" height="6" rx="4" fill="#D4B87A"/>
    <path d="M22 1 Q32 3 42 1" stroke="#B89555" stroke-width="1" fill="none"/>
    <rect x="15" y="8" width="34" height="4" rx="2" fill="#5C3A1E"/>
    <line x1="19" y1="9.5" x2="21" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
    <line x1="24" y1="9.5" x2="26" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
    <line x1="29" y1="9.5" x2="31" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
    <line x1="34" y1="9.5" x2="36" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
    <line x1="39" y1="9.5" x2="41" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
    <line x1="44" y1="9.5" x2="46" y2="9.5" stroke="#7B5230" stroke-width="0.8"/>
  </g>

  <!-- Robotic modern "HAIRA" lettering -->
  <defs>
    <linearGradient id="textGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#C4A265"/>
    </linearGradient>
  </defs>
  <g transform="translate(278, 138)">
    <!-- H -->
    <g fill="url(#textGlow)">
      <rect x="0" y="0" width="5" height="30" rx="1"/>
      <rect x="21" y="0" width="5" height="30" rx="1"/>
      <rect x="5" y="12" width="16" height="5" rx="1"/>
      <!-- circuit dot on H crossbar -->
      <circle cx="13" cy="14.5" r="1.8" fill="#FDE68A"/>
    </g>
    <!-- A -->
    <g fill="url(#textGlow)" transform="translate(34, 0)">
      <polygon points="11,0 0,30 5.5,30 11,6 16.5,30 22,30 11,0"/>
      <rect x="4" y="18" width="14" height="4.5" rx="1"/>
      <!-- circuit notch -->
      <rect x="9" y="28" width="4" height="2" rx="0.5" fill="#FDE68A" opacity="0.6"/>
    </g>
    <!-- I -->
    <g fill="url(#textGlow)" transform="translate(64, 0)">
      <rect x="0" y="0" width="14" height="4.5" rx="1"/>
      <rect x="4.5" y="0" width="5" height="30" rx="1"/>
      <rect x="0" y="25.5" width="14" height="4.5" rx="1"/>
      <!-- circuit dots -->
      <circle cx="2" cy="2.2" r="1.3" fill="#FDE68A" opacity="0.7"/>
      <circle cx="12" cy="27.8" r="1.3" fill="#FDE68A" opacity="0.7"/>
    </g>
    <!-- R -->
    <g fill="url(#textGlow)" transform="translate(86, 0)">
      <rect x="0" y="0" width="5" height="30" rx="1"/>
      <rect x="0" y="0" width="18" height="4.5" rx="1"/>
      <rect x="15" y="4" width="5" height="9" rx="1"/>
      <rect x="5" y="12" width="15" height="4.5" rx="1"/>
      <!-- diagonal leg -->
      <polygon points="12,16.5 18,30 23.5,30 17,16.5"/>
      <!-- circuit dot at joint -->
      <circle cx="14" cy="14.5" r="1.8" fill="#FDE68A"/>
    </g>
    <!-- A (second) -->
    <g fill="url(#textGlow)" transform="translate(118, 0)">
      <polygon points="11,0 0,30 5.5,30 11,6 16.5,30 22,30 11,0"/>
      <rect x="4" y="18" width="14" height="4.5" rx="1"/>
      <rect x="9" y="28" width="4" height="2" rx="0.5" fill="#FDE68A" opacity="0.6"/>
    </g>
  </g>
  <!-- Thin tech lines flanking the wordmark -->
  <line x1="260" y1="155" x2="275" y2="155" stroke="#E8A317" stroke-width="0.8" opacity="0.4"/>
  <line x1="525" y1="155" x2="540" y2="155" stroke="#E8A317" stroke-width="0.4" opacity="0.4"/>
  <circle cx="257" cy="155" r="1.5" fill="#E8A317" opacity="0.5"/>
  <circle cx="543" cy="155" r="1.5" fill="#E8A317" opacity="0.5"/>
  <text x="400" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">Build agents and workflows, not boilerplate.</text>
</svg>
