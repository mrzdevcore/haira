<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{if .Title}}{{.Title}}{{else}}{{.Name}}{{end}} - Haira Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
.header{background:#16213e;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #0f3460}
.header h1{font-size:1.1rem;font-weight:600;color:#e0e0e0}
.settings-toggle{background:none;border:1px solid #555;color:#aaa;padding:.3rem .7rem;border-radius:4px;cursor:pointer;font-size:.8rem}
.settings-toggle:hover{border-color:#4f8cff;color:#4f8cff}
.settings-panel{background:#16213e;border-bottom:1px solid #0f3460;padding:.75rem 1rem;display:none}
.settings-panel.open{display:flex;flex-wrap:wrap;gap:.75rem}
.settings-panel label{font-size:.8rem;color:#aaa;display:flex;flex-direction:column;gap:.25rem;min-width:140px}
.settings-panel input,.settings-panel select{background:#1a1a2e;border:1px solid #333;color:#e0e0e0;padding:.35rem .5rem;border-radius:4px;font-size:.85rem}
.messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.msg{max-width:80%;padding:.75rem 1rem;border-radius:12px;line-height:1.5;font-size:.9rem;word-wrap:break-word}
.msg-user{background:#4f8cff;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg-assistant{background:#2a2a4a;color:#e0e0e0;align-self:flex-start;border-bottom-left-radius:4px}
.msg-assistant pre{background:#1a1a2e;padding:.5rem;border-radius:4px;overflow-x:auto;margin:.5rem 0;font-size:.8rem}
.msg-assistant code{background:#1a1a2e;padding:.1rem .3rem;border-radius:3px;font-size:.85rem}
.msg-assistant pre code{background:none;padding:0}
.msg-assistant strong{font-weight:700}
.typing{display:none;align-self:flex-start;padding:.5rem 1rem;color:#888;font-size:.85rem;font-style:italic}
.input-area{background:#16213e;padding:.75rem 1rem;border-top:1px solid #0f3460;display:flex;gap:.5rem}
.input-area textarea{flex:1;background:#1a1a2e;border:1px solid #333;color:#e0e0e0;padding:.6rem .75rem;border-radius:8px;font-size:.9rem;font-family:inherit;resize:none;min-height:44px;max-height:120px;outline:none}
.input-area textarea:focus{border-color:#4f8cff}
.input-area button{background:#4f8cff;color:#fff;border:none;padding:0 1.25rem;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
.input-area button:hover{background:#3a7ae0}
.input-area button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="header">
  <h1>{{if .Title}}{{.Title}}{{else}}{{.Name}}{{end}}</h1>
  {{if .SettingsParams}}<button class="settings-toggle" id="settings-btn">Settings</button>{{end}}
</div>
{{if .SettingsParams}}
<div class="settings-panel" id="settings-panel">
  {{range .SettingsParams}}
  <label>{{.Name}}
    {{if eq .Type "bool"}}<input type="checkbox" id="s-{{.Name}}" name="{{.Name}}">
    {{else if eq .Type "int"}}<input type="number" id="s-{{.Name}}" name="{{.Name}}" step="1">
    {{else if eq .Type "float"}}<input type="number" id="s-{{.Name}}" name="{{.Name}}" step="any">
    {{else}}<input type="text" id="s-{{.Name}}" name="{{.Name}}">
    {{end}}
  </label>
  {{end}}
</div>
{{end}}
<div class="messages" id="messages"></div>
<div class="typing" id="typing">Assistant is typing...</div>
<div class="input-area">
  <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>
<script>
(function(){
  var messages=document.getElementById("messages");
  var input=document.getElementById("chat-input");
  var sendBtn=document.getElementById("send-btn");
  var typing=document.getElementById("typing");
  var settingsBtn=document.getElementById("settings-btn");
  var settingsPanel=document.getElementById("settings-panel");
  var chatParam="{{.ChatParam}}";
  var path="{{.Path}}";
  var sessionId=sessionStorage.getItem("haira-session-"+path);
  if(!sessionId){sessionId=crypto.randomUUID();sessionStorage.setItem("haira-session-"+path,sessionId)}

  if(settingsBtn){settingsBtn.addEventListener("click",function(){settingsPanel.classList.toggle("open")})}

  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
  });
  input.addEventListener("input",function(){
    this.style.height="auto";
    this.style.height=Math.min(this.scrollHeight,120)+"px";
  });
  sendBtn.addEventListener("click",sendMessage);

  function addMsg(role,text){
    var div=document.createElement("div");
    div.className="msg msg-"+role;
    if(role==="assistant") div.innerHTML=renderMd(text);
    else div.textContent=text;
    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
    return div;
  }

  function renderMd(t){
    // Code blocks
    t=t.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,lang,code){return"<pre><code>"+esc(code.trim())+"</code></pre>"});
    // Inline code
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    // Bold
    t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    // Newlines
    t=t.replace(/\n/g,"<br>");
    return t;
  }
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

  function getSettings(){
    var s={};
    var panel=document.getElementById("settings-panel");
    if(!panel) return s;
    var inputs=panel.querySelectorAll("input");
    for(var i=0;i<inputs.length;i++){
      var inp=inputs[i];
      if(inp.type==="checkbox") s[inp.name]=inp.checked;
      else if(inp.type==="number"&&inp.value) s[inp.name]=Number(inp.value);
      else if(inp.value) s[inp.name]=inp.value;
    }
    return s;
  }

  function sendMessage(){
    var text=input.value.trim();
    if(!text) return;
    input.value="";
    input.style.height="auto";
    addMsg("user",text);

    sendBtn.disabled=true;
    typing.style.display="block";
    messages.scrollTop=messages.scrollHeight;

    var body=getSettings();
    body[chatParam]=text;
    body["session_id"]=sessionId;

    var assistantDiv=addMsg("assistant","");
    var fullText="";

    fetch(path,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"text/event-stream"},
      body:JSON.stringify(body)
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      var reader=r.body.getReader();
      var decoder=new TextDecoder();
      var buf="";

      function read(){
        return reader.read().then(function(result){
          if(result.done){
            typing.style.display="none";
            sendBtn.disabled=false;
            input.focus();
            return;
          }
          buf+=decoder.decode(result.value,{stream:true});
          var lines=buf.split("\n");
          buf=lines.pop();
          for(var i=0;i<lines.length;i++){
            var line=lines[i].trim();
            if(!line.startsWith("data:")) continue;
            var data=line.substring(5).trim();
            if(data==="[DONE]") continue;
            try{
              var parsed=JSON.parse(data);
              if(parsed.delta){
                fullText+=parsed.delta;
                assistantDiv.innerHTML=renderMd(fullText);
                messages.scrollTop=messages.scrollHeight;
              }
            }catch(e){}
          }
          return read();
        });
      }
      return read();
    }).catch(function(err){
      typing.style.display="none";
      sendBtn.disabled=false;
      assistantDiv.innerHTML="<em>Error: "+esc(err.message)+"</em>";
    });
  }
})();
</script>
</body>
</html>
