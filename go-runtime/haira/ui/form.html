<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{if .Title}}{{.Title}}{{else}}{{.Name}}{{end}} - Haira</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem}
.container{max-width:600px;width:100%}
h1{font-size:1.5rem;margin-bottom:.25rem}
.desc{color:#666;margin-bottom:1.5rem;font-size:.9rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:3px;margin-left:.5rem;vertical-align:middle;color:#fff}
.badge-POST{background:#49cc90}.badge-GET{background:#61affe}.badge-PUT{background:#fca130}.badge-DELETE{background:#f93e3e}
.path{font-family:monospace;font-size:.85rem;color:#555;margin-bottom:1.5rem}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:1.5rem;margin-bottom:1rem}
label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.9rem}
input[type=text],input[type=number],input[type=file],select,textarea{width:100%;padding:.5rem .75rem;border:1px solid #ddd;border-radius:5px;font-size:.9rem;margin-bottom:1rem;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:#4f8cff;box-shadow:0 0 0 2px rgba(79,140,255,.15)}
.checkbox-row{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.checkbox-row input{width:auto;margin:0}
button{background:#4f8cff;color:#fff;border:none;padding:.6rem 1.5rem;border-radius:5px;font-size:.95rem;cursor:pointer;font-weight:600;width:100%}
button:hover{background:#3a7ae0}
button:disabled{opacity:.6;cursor:not-allowed}
.result{margin-top:1rem}
.result-header{font-weight:600;font-size:.85rem;margin-bottom:.5rem;color:#555}
.result-body{background:#1e1e1e;color:#d4d4d4;padding:1rem;border-radius:5px;font-family:monospace;font-size:.85rem;white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto}
.result-body.error{border-left:3px solid #f93e3e}
.result-body.success{border-left:3px solid #49cc90}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:.5rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <h1>{{if .Title}}{{.Title}}{{else}}{{.Name}}{{end}} <span class="badge badge-{{.Method}}">{{.Method}}</span></h1>
  {{if .Description}}<p class="desc">{{.Description}}</p>{{end}}
  <p class="path">{{.Path}}</p>
  <div class="card">
    <form id="wf-form" enctype="multipart/form-data">
      {{range .Params}}
      {{if eq .Type "bool"}}
      <div class="checkbox-row">
        <input type="checkbox" id="p-{{.Name}}" name="{{.Name}}">
        <label for="p-{{.Name}}" style="margin:0;font-weight:400">{{.Name}}</label>
      </div>
      {{else if eq .Type "file"}}
      <label for="p-{{.Name}}">{{.Name}}</label>
      <input type="file" id="p-{{.Name}}" name="{{.Name}}">
      {{else if eq .Type "int"}}
      <label for="p-{{.Name}}">{{.Name}}</label>
      <input type="number" id="p-{{.Name}}" name="{{.Name}}" step="1">
      {{else if eq .Type "float"}}
      <label for="p-{{.Name}}">{{.Name}}</label>
      <input type="number" id="p-{{.Name}}" name="{{.Name}}" step="any">
      {{else}}
      <label for="p-{{.Name}}">{{.Name}}</label>
      <input type="text" id="p-{{.Name}}" name="{{.Name}}">
      {{end}}
      {{end}}
      <button type="submit" id="submit-btn">Run</button>
    </form>
  </div>
  <div class="result" id="result" style="display:none">
    <div class="card">
      <div class="result-header">Response</div>
      <div class="result-body" id="result-body"></div>
    </div>
  </div>
</div>
<script>
(function(){
  var form=document.getElementById("wf-form");
  var btn=document.getElementById("submit-btn");
  var resultDiv=document.getElementById("result");
  var resultBody=document.getElementById("result-body");
  var method="{{.Method}}";
  var path="{{.Path}}";
  var hasFile={{.HasFile}};

  form.addEventListener("submit",function(e){
    e.preventDefault();
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>Running...';
    resultDiv.style.display="none";

    var url=path;
    var opts={method:method,headers:{}};

    if(method==="GET"||method==="DELETE"){
      var qs=new URLSearchParams();
      var inputs=form.querySelectorAll("input,select,textarea");
      for(var i=0;i<inputs.length;i++){
        var inp=inputs[i];
        if(inp.type==="checkbox") qs.set(inp.name,inp.checked?"true":"false");
        else if(inp.type!=="file"&&inp.value) qs.set(inp.name,inp.value);
      }
      if(qs.toString()) url+="?"+qs.toString();
    } else if(hasFile){
      var fd=new FormData(form);
      opts.body=fd;
    } else {
      var body={};
      var inputs=form.querySelectorAll("input,select,textarea");
      for(var i=0;i<inputs.length;i++){
        var inp=inputs[i];
        if(inp.type==="checkbox") body[inp.name]=inp.checked;
        else if(inp.type==="number"&&inp.value) body[inp.name]=Number(inp.value);
        else if(inp.value) body[inp.name]=inp.value;
      }
      opts.headers["Content-Type"]="application/json";
      opts.body=JSON.stringify(body);
    }

    fetch(url,opts).then(function(r){
      return r.text().then(function(t){return{status:r.status,text:t}});
    }).then(function(res){
      resultDiv.style.display="block";
      resultBody.className="result-body "+(res.status>=400?"error":"success");
      try{resultBody.textContent=JSON.stringify(JSON.parse(res.text),null,2)}
      catch(e){resultBody.textContent=res.text}
    }).catch(function(err){
      resultDiv.style.display="block";
      resultBody.className="result-body error";
      resultBody.textContent="Network error: "+err.message;
    }).finally(function(){
      btn.disabled=false;
      btn.textContent="Run";
    });
  });
})();
</script>
</body>
</html>
